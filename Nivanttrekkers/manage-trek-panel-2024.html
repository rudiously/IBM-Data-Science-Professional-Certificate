<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Nivant Trekkers</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi:ital@0;1&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <style>
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(244, 232, 208, 0.85), rgba(232, 220, 196, 0.85)),
                url('image.png') center/cover no-repeat fixed;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 90%;
            border: 2px solid var(--kesari);
        }
        .login-box h2 {
            color: var(--maroon);
            margin-bottom: 2rem;
            text-align: center;
            font-family: 'Tiro Devanagari Marathi', serif;
        }
        .login-box input {
            width: 100%;
            padding: 1rem;
            margin-bottom: 1rem;
            border: 2px solid var(--stone-grey);
            border-radius: 8px;
            font-size: 1rem;
            font-family: 'Tiro Devanagari Marathi', serif;
        }
        .login-box input:focus {
            outline: none;
            border-color: var(--maroon);
        }
        .login-box button {
            width: 100%;
            padding: 1rem;
            background: var(--maroon);
            color: white;
            border: 2px solid var(--kesari);
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Tiro Devanagari Marathi', serif;
        }
        .login-box button:hover {
            background: #5c0000;
        }
        .error-msg {
            color: #dc3545;
            text-align: center;
            margin-top: 1rem;
            display: none;
            font-family: 'Tiro Devanagari Marathi', serif;
        }
        .admin-content {
            display: none;
        }
    </style>
</head>
<body class="admin-body">
    <!-- Login Overlay -->
    <div class="login-overlay" id="loginOverlay">
        <div class="login-box">
            <h2>🔒 Admin Login</h2>
            <input type="password" id="adminPassword" placeholder="Enter Password" />
            <button onclick="checkPassword()">Login</button>
            <p class="error-msg" id="errorMsg">Incorrect password!</p>
        </div>
    </div>

    <!-- Admin Content (Hidden until login) -->
    <div class="admin-content" id="adminContent">
        <div class="admin-container">
            <div class="admin-header">
                <h1>Nivant Trekkers Admin Panel</h1>
                <a href="index.html" class="back-btn">View Site</a>
            </div>

            <form id="adminForm" class="admin-form">
                <div class="form-section">
                    <h2>Basic Information</h2>
                    <div class="form-group">
                        <label>Trek Name / Fort Name</label>
                        <input type="text" id="trekName" required placeholder="e.g. Rajgad">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Route</label>
                            <input type="text" id="route" placeholder="e.g. Pune - Rajgad">
                        </div>
                        <div class="form-group">
                            <label>Difficulty</label>
                            <select id="difficulty">
                                <option value="Easy">Easy</option>
                                <option value="Moderate">Moderate</option>
                                <option value="Difficult">Difficult</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Trek Date</label>
                            <input type="date" id="trekDate" placeholder="Select date">
                        </div>
                        <div class="form-group">
                            <label>Trek Time (Optional)</label>
                            <input type="text" id="trekTime" placeholder="e.g. 6:00 AM">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Gallery Images</h2>
                    <div class="form-group">
                        <label>Trek Gallery Images (Multiple)</label>
                        <input type="file" id="trekImages" accept="image/*" multiple>
                        <div class="image-preview-grid" id="trekImagesPreview"></div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Fort Details</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Fort Name</label>
                            <input type="text" id="fortName" placeholder="e.g. Rajgad">
                        </div>
                        <div class="form-group">
                            <label>Grade</label>
                            <input type="text" id="fortGrade" placeholder="e.g. Hill Fort">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Elevation</label>
                            <input type="text" id="fortElevation" placeholder="e.g. 1376 meters">
                        </div>
                        <div class="form-group">
                            <label>Region</label>
                            <input type="text" id="fortRegion" placeholder="e.g. Sahyadri">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Historical Significance</h2>
                    <div class="form-group">
                        <textarea id="history" rows="6" placeholder="Write the fort's history and significance here..."></textarea>
                    </div>
                </div>

                <div class="form-section">
                    <h2>Pune Pickup Points</h2>
                    <div id="pickupPointsContainer"></div>
                    <button type="button" class="add-btn" onclick="addPickupPoint()">+ Add Pickup Point</button>
                </div>

                <div class="form-section">
                    <h2>Itinerary</h2>
                    <div id="itineraryContainer"></div>
                    <button type="button" class="add-btn" onclick="addItinerary()">+ Add Itinerary Item</button>
                </div>

                <div class="form-section">
                    <h2>Trek Fees</h2>
                    <div class="form-group">
                        <label>Fees from Pune</label>
                        <input type="text" id="feesPune" placeholder="e.g. ₹1200">
                    </div>
                </div>

                <div class="form-section">
                    <h2>Inclusions</h2>
                    <div id="inclusionsContainer"></div>
                    <button type="button" class="add-btn" onclick="addInclusion()">+ Add Inclusion</button>
                </div>

                <div class="form-section">
                    <h2>Things to Carry</h2>
                    <div id="carryContainer"></div>
                    <button type="button" class="add-btn" onclick="addCarryItem()">+ Add Item</button>
                </div>

                <div class="form-section">
                    <h2>Important Instructions</h2>
                    <div id="instructionsContainer"></div>
                    <button type="button" class="add-btn" onclick="addInstruction()">+ Add Instruction</button>
                </div>

                <div class="form-section">
                    <h2>Contact Details</h2>
                    <div id="contactsContainer"></div>
                    <button type="button" class="add-btn" onclick="addContact()">+ Add Contact</button>
                </div>

                <div class="form-section">
                    <h2>Social Media</h2>
                    <div class="form-group">
                        <label>Instagram Handle</label>
                        <input type="text" id="instagram" placeholder="@nivanttrekkers">
                    </div>
                </div>

                <button type="submit" class="save-btn">💾 Save All Changes</button>
            </form>
        </div>
    </div>

    <script>
        // Password protection - CHANGE THIS PASSWORD!
        function checkPassword() {
            const password = document.getElementById('adminPassword').value;
            const correctPassword = 'NivantTrek@2024!'; // IMPORTANT: Change this to your own secure password
            
            if (password === correctPassword) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
                sessionStorage.setItem('adminLoggedIn', 'true');
            } else {
                document.getElementById('errorMsg').style.display = 'block';
                document.getElementById('adminPassword').value = '';
            }
        }

        // Check if already logged in
        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('adminLoggedIn') === 'true') {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
            }
        });

        // Allow Enter key to submit password
        document.getElementById('adminPassword').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
    <!-- Supabase Backend -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://setqjejhlomluanzhxpk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNldHFqZWpobG9tbHVhbnpoeHBrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzA0NzY2MjcsImV4cCI6MjA4NjA1MjYyN30.gyU1ZMZ3-wsLij0iMzHK76C_xI9gNHvwwMt1FI5ZnY0';
        
        let supabaseClient;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase client created');
        } catch (err) {
            console.error('❌ Failed to create Supabase client:', err);
        }
        
        const SupabaseDB = {
            async saveTrekData(data) {
                try {
                    if (!supabaseClient) throw new Error('Supabase client not initialized');
                    
                    console.log('🔍 Checking for existing data...');
                    const { data: existing, error: selectError } = await supabaseClient.from('trek_data').select('id').limit(1).single();
                    
                    if (selectError && selectError.code !== 'PGRST116') {
                        console.error('❌ Select error:', selectError);
                        throw selectError;
                    }
                    
                    if (existing) {
                        console.log('📝 Updating existing record:', existing.id);
                        const { error } = await supabaseClient.from('trek_data').update({ data: data }).eq('id', existing.id);
                        if (error) {
                            console.error('❌ Update error:', error);
                            throw error;
                        }
                        console.log('✅ Updated successfully!');
                    } else {
                        console.log('➕ Inserting new record...');
                        const { error } = await supabaseClient.from('trek_data').insert([{ data: data }]);
                        if (error) {
                            console.error('❌ Insert error:', error);
                            throw error;
                        }
                        console.log('✅ Inserted successfully!');
                    }
                    
                    console.log('✅ Saved to Supabase!');
                    return { success: true };
                } catch (error) { 
                    console.error('❌ Save error:', error); 
                    return { success: false, error: error.message }; 
                }
            },
            async loadTrekData() {
                try {
                    if (!supabaseClient) throw new Error('Supabase client not initialized');
                    
                    const { data, error } = await supabaseClient.from('trek_data').select('data').limit(1).single();
                    if (error) { 
                        if (error.code === 'PGRST116') {
                            console.log('ℹ️ No data in Supabase yet');
                            return null;
                        }
                        throw error; 
                    }
                    console.log('✅ Loaded from Supabase!');
                    return data.data;
                } catch (error) { 
                    console.error('❌ Load error:', error); 
                    return null; 
                }
            }
        };
    </script>
    <!-- Admin Script -->
    <script src="admin.js"></script>
</body>
</html>
