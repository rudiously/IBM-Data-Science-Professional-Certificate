        <!-- Inclusions -->

        </section>

        <!-- Things to Carry -->
        <section class="carry-section fade-in">
            <h2 class="section-heading">Things to Carry</h2>
            <div class="carry-list" id="carryGrid"></div>
        </section>

        <!-- Instructions -->
        <section class="instructions-section fade-in">
            <h2 class="section-heading">Important Instructions</h2>
            <div class="instructions-scroll" id="instructionsList"></div>
        </section>

        <!-- Contact -->
        <section class="contact-section fade-in" id="contact">
            <h2 class="section-heading">Contact & Registration</h2>
            <div class="contact-scroll" id="contactContent"></div>
        </section>

        <!-- Signature -->

            <p class="closing-text">Jai Bhavani, Jai Shivaji</p>
            <div class="signature">
                <p class="signature-text">— Nivant Trekkers</p>
